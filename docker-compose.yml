services:
  postgres:
    image: postgis/postgis:17-3.5
    container_name: hoangsuphi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: hoangsuphi
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      TZ: Asia/Ho_Chi_Minh
      PGTZ: Asia/Ho_Chi_Minh
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hoangsuphi"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hoangsuphi-network

  redis:
    image: redis:8-alpine
    container_name: hoangsuphi-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hoangsuphi-network

volumes:
  postgres_data:
  redis_data:

networks:
  hoangsuphi-network:
    driver: bridge
